<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{productName}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 480px; text-align: center; }
  .badge { display: inline-block; background: rgba(0,198,255,0.1); border: 1px solid rgba(0,198,255,0.25); color: #00c6ff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 99px; padding: 0.25rem 0.75rem; margin-bottom: 1.25rem; }
  h1 { font-size: 1.8rem; color: #fff; margin-bottom: 0.75rem; line-height: 1.25; }
  .desc { color: #888; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
  .price-box { background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem; }
  .price-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #555; margin-bottom: 0.4rem; }
  .price { font-size: 2.5rem; font-weight: 700; color: #fff; }
  .price span { font-size: 1rem; color: #00c6ff; margin-left: 6px; }
  .currency-note { font-size: 0.75rem; color: #555; margin-top: 0.3rem; }
  form button { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  form button:hover { opacity: 0.9; }
  .footer-note { margin-top: 1.25rem; font-size: 0.75rem; color: #444; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">ZSD Paywall</div>
  <h1>{{productName}}</h1>
  <p class="desc">{{productDesc}}</p>
  <div class="price-box">
    <div class="price-label">Price</div>
    <div class="price">{{priceZsd}}<span>ZSD</span></div>
    <div class="currency-note">Zephyr Stable Dollar · private &amp; instant</div>
  </div>
  <form method="POST" action="/pay">
    <button type="submit">Buy Now →</button>
  </form>
  <p class="footer-note">You'll receive a one-time download link after payment is confirmed on-chain.</p>
</div>
</body>
</html>
